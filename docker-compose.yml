services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all", "--quiet", "--wiredTigerCacheSizeGB=2"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    cpus: 0.75
    mem_limit: 4g
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-panel:3.5.1
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      CONFIG_SOURCE_FILE: /config/config.json
      # Non-secret Docker wiring; Telegram/admin credentials stay in the JSON file.
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: telegram_panel
      STORAGE_BACKEND: mongo
      DATA_DIR: /app/data
      CLIENTS_JSON_PATH: /app/data/clients.json
      HEALTH_PORT: "8070"
      HEALTH_HOST: 0.0.0.0
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./config:/config:ro
      - bot_data:/app/data
      - bot_logs:/app/logs
    # The panel is local-only by default. Reach it with an SSH tunnel, or put
    # HTTPS + an IP allow-list in front of it before exposing it to the Internet.
    ports:
      - "127.0.0.1:8070:8070"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8070/health', timeout=5)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    # App code/config are immutable inside the container; only named data/log
    # volumes and ephemeral tmpfs paths are writable.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /run:rw,noexec,nosuid,size=16m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The root entrypoint needs only these to repair old named-volume ownership
    # and drop to the unprivileged telegram user before running Python.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cpus: 3.25
    mem_limit: 8g
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  mongo_data:
  bot_data:
  bot_logs:
