# VPS / any Docker host: the bot + a private MongoDB instance in one command.
#
#   1. cp env.example .env    and fill in API_ID / API_HASH / BOT_TOKEN / ADMIN_ID
#   2. docker compose up -d --build
#   3. docker compose logs -f bot
#
# MONGODB_URI is wired to the bundled database, so every signed-in account,
# wallet, order and channel survives restarts and container rebuilds.
#
# (Railway users: deploy the same repo with the Dockerfile + the MongoDB plugin
#  template instead of this file — see the "Deploy on Railway" section of the README.)
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["--bind_ip_all", "--quiet"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: telegram_panel
      STORAGE_BACKEND: auto
      DATA_DIR: /app/data
      HEALTH_PORT: "8080"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - bot_data:/app/data
      - bot_logs:/app/logs
    # Local status endpoint — open http://<vps-ip>:8080/health
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    ports:
      - "8080:8080"

volumes:
  mongo_data:
  bot_data:
  bot_logs:
